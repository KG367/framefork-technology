{% load static %}
<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="icon" href="{% static 'img/fav/favicon.ico' %}" type="image">
    <link rel="apple-touch-icon" sizes="180x180" href="{% static 'img/fav/apple-touch-icon.png' %}">
    <link rel="icon" type="image/png" sizes="32x32" href="{% static 'img/fav/favicon-32x32.png' %}">
    <link rel="icon" type="image/png" sizes="16x16" href="{% static 'img/fav/favicon-16x16.png' %}">
    <link rel="stylesheet" href="{% static 'css/bootstrap.min.css' %}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,600;1,400&family=Manrope:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
      body {
        font-family: 'Manrope', system-ui, sans-serif;
        background-color: #f7f9fc;
        color: #23272f;
      }
      h1, .navbar-brand {
        font-weight: 800;
        letter-spacing: -0.02em;
      }
      .navbar-brand { font-size: 1.4rem; }
      article p, .page-text p {
        font-family: 'Lora', Georgia, serif;
        font-size: 1.1rem;
        line-height: 1.7;
      }
      article ul {
        list-style: none;
        padding-left: 0;
        color: #6b7280;
        font-size: 0.9rem;
      }
      footer p { margin: 0; color: #6b7280; }
    </style>
    <title>{% block title %}Блогикум{% endblock %}</title>
  </head>
  <body>
    {% with view_name=request.resolver_match.view_name %}
    <header>
      <nav class="navbar navbar-light" style="background-color: lightskyblue">
        <div class="container">
          <a class="navbar-brand" href="{% url 'blog:index' %}">
            <img src="{% static 'img/logo.png' %}" width="30" height="30" class="d-inline-block align-top" alt="">
            Блогикум
          </a>
          <ul class="nav nav-pills">
            <li class="nav-item">
              <a class="nav-link {% if view_name == 'blog:index' %}active{% endif %}" href="{% url 'blog:index' %}">
                Лента записей
              </a>
            </li>
            <li class="nav-item">
              <a class="nav-link {% if view_name == 'pages:about' %}active{% endif %}" href="{% url 'pages:about' %}">
                О проекте
              </a>
            </li>
            <li class="nav-item">
              <a class="nav-link {% if view_name == 'pages:rules' %}active{% endif %}" href="{% url 'pages:rules' %}">
                Наши правила
              </a>
            </li>
          </ul>
        </div>
      </nav>
    </header>
    {% endwith %}
    <main>
      <div class="container py-5">
        {% block content %}{% endblock %}
      </div>
    </main>
    <footer class="border-top text-center py-3">
      <p>© Блогикум</p>
    </footer>
  </body>
</html>
